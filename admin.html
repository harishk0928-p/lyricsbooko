<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lyricsbook — Admin Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#1a1008;--paper:#fdf8f0;--cream:#f5edd8;--gold:#c8882a;--gold-lt:#f0c060;--muted:#7a6a52;--border:#e2d4b8;--card-bg:#fffcf5;--red:#c0392b;--green:#1a7a30;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  #loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:1rem;}
  .login-card{background:var(--card-bg);border-radius:20px;padding:2.5rem 2.25rem;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.4);border:1px solid var(--border);}
  .login-logo{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold);margin-bottom:.25rem;}
  .login-logo span{color:var(--ink);font-style:italic;}
  .login-sub{font-size:.82rem;color:var(--muted);margin-bottom:2rem;}
  .field{margin-bottom:1rem;}
  .field label{display:block;font-size:.8rem;font-weight:500;margin-bottom:.4rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
  .field input{width:100%;padding:.75rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.95rem;background:var(--paper);color:var(--ink);outline:none;transition:border-color .2s;}
  .field input:focus{border-color:var(--gold);}
  .btn-primary{width:100%;padding:.85rem;background:var(--gold);border:none;border-radius:8px;color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:500;font-size:.95rem;cursor:pointer;transition:background .2s;margin-top:.5rem;}
  .btn-primary:hover{background:var(--gold-lt);}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
  .error-msg{background:#fce9e9;color:var(--red);border-radius:6px;padding:.6rem .9rem;font-size:.82rem;margin-top:.75rem;display:none;}
  #adminPage{display:none;}
  .admin-header{background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100;}
  .admin-logo{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold-lt);}
  .admin-logo em{color:#fff;font-style:italic;}
  .header-right{display:flex;align-items:center;gap:1rem;}
  .header-right a{color:#bbb;font-size:.8rem;text-decoration:none;text-transform:uppercase;letter-spacing:.05em;}
  .header-right a:hover{color:var(--gold-lt);}
  .btn-logout{padding:.35rem 1rem;border:1px solid rgba(200,136,42,.5);border-radius:50px;background:transparent;color:#bbb;font-family:'DM Sans',sans-serif;font-size:.78rem;cursor:pointer;transition:all .2s;}
  .btn-logout:hover{border-color:var(--gold);color:var(--gold-lt);}
  .admin-body{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  .tabs{display:flex;margin-bottom:2rem;border-bottom:2px solid var(--border);}
  .tab{padding:.7rem 1.5rem;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;}
  .tab.active{color:var(--gold);border-color:var(--gold);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .form-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:2rem;}
  .form-section{margin-bottom:1.75rem;}
  .form-section-title{font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .form-field{margin-bottom:1rem;}
  .form-field label{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:.4rem;letter-spacing:.03em;}
  .form-field input,.form-field select,.form-field textarea{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.92rem;background:var(--paper);color:var(--ink);outline:none;transition:border-color .2s;}
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold);}
  .form-field textarea{resize:vertical;min-height:200px;line-height:1.7;}
  .tag-input-wrap{border:1px solid var(--border);border-radius:8px;padding:.5rem .75rem;background:var(--paper);display:flex;flex-wrap:wrap;gap:6px;align-items:center;transition:border-color .2s;min-height:46px;}
  .tag-input-wrap:focus-within{border-color:var(--gold);}
  .singer-tag{background:var(--cream);border-radius:50px;padding:3px 10px 3px 12px;font-size:.82rem;display:flex;align-items:center;gap:5px;color:var(--ink);}
  .singer-tag button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.9rem;line-height:1;padding:0;}
  .singer-tag button:hover{color:var(--red);}
  .tag-input{border:none!important;outline:none!important;background:transparent;padding:0!important;font-size:.92rem;min-width:120px;flex:1;color:var(--ink);}
  .tag-hint{font-size:.72rem;color:var(--muted);}
  .lang-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .lang-chip{padding:5px 14px;border-radius:50px;border:1px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;color:var(--muted);transition:all .2s;}
  .lang-chip:hover{border-color:var(--gold);color:var(--gold);}
  .lang-chip.active{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500;}
  .form-footer{display:flex;gap:1rem;align-items:center;justify-content:flex-end;padding-top:1.25rem;border-top:1px solid var(--border);flex-wrap:wrap;}
  .btn-secondary{padding:.7rem 1.5rem;border:1px solid var(--border);border-radius:8px;background:transparent;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s;}
  .btn-secondary:hover{border-color:var(--gold);color:var(--gold);}
  .btn-publish{padding:.7rem 2rem;background:var(--gold);border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.92rem;color:var(--ink);cursor:pointer;transition:background .2s;}
  .btn-publish:hover{background:var(--gold-lt);}
  .btn-publish:disabled{opacity:.6;cursor:not-allowed;}
  .edit-bar{display:none;margin-top:1rem;padding:.75rem 1rem;background:var(--cream);border-radius:8px;font-size:.84rem;color:var(--muted);align-items:center;justify-content:space-between;gap:1rem;}
  .edit-bar.visible{display:flex;}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;padding:.8rem 1.25rem;border-radius:10px;font-size:.88rem;display:flex;align-items:center;gap:.6rem;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s,transform .3s;max-width:340px;}
  .toast.show{opacity:1;transform:none;pointer-events:auto;}
  .toast.success{background:#e9fce9;color:var(--green);border:1px solid #c0ddc0;}
  .toast.error{background:#fce9e9;color:var(--red);border:1px solid #e0c0c0;}
  .song-list{display:flex;flex-direction:column;gap:.75rem;}
  .song-row{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;display:flex;align-items:flex-start;gap:1rem;transition:border-color .2s;}
  .song-row:hover{border-color:var(--gold);}
  .song-row-info{flex:1;min-width:0;}
  .row-title{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-meta{font-size:.78rem;color:var(--muted);margin-top:3px;}
  .row-actions{display:flex;gap:.5rem;flex-shrink:0;}
  .btn-icon{width:34px;height:34px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--muted);transition:all .2s;}
  .btn-icon:hover{border-color:var(--gold);color:var(--gold);}
  .btn-icon.del:hover{border-color:var(--red);color:var(--red);}
  .row-lang{font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:50px;white-space:nowrap;flex-shrink:0;align-self:center;}
  .lang-tamil{background:#fce9e9;color:var(--red);}
  .lang-telugu{background:#e9f0fc;color:#1a4fa0;}
  .lang-kannada{background:#e9fce9;color:#1a7a30;}
  .lang-malayalam{background:#f5e9fc;color:#6a1a9a;}
  .lang-hindi{background:#fef4e8;color:#a06010;}
  .lang-other{background:#f0f0f0;color:#555;}
  .list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem;}
  .list-search{padding:.6rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;background:var(--paper);color:var(--ink);outline:none;width:240px;transition:border-color .2s;}
  .list-search:focus{border-color:var(--gold);}
  .list-count{font-size:.82rem;color:var(--muted);}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:3rem auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .confirm-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(10,6,2,.6);align-items:center;justify-content:center;backdrop-filter:blur(2px);}
  .confirm-overlay.open{display:flex;}
  .confirm-box{background:var(--card-bg);border-radius:14px;padding:2rem;max-width:360px;width:100%;border:1px solid var(--border);box-shadow:0 24px 64px rgba(0,0,0,.3);}
  .confirm-box h3{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:.5rem;}
  .confirm-box p{font-size:.88rem;color:var(--muted);margin-bottom:1.5rem;}
  .confirm-btns{display:flex;gap:.75rem;justify-content:flex-end;}
  .btn-cancel{padding:.6rem 1.25rem;border:1px solid var(--border);border-radius:8px;background:transparent;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer;color:var(--muted);}
  .btn-delete{padding:.6rem 1.25rem;border:none;border-radius:8px;background:var(--red);color:#fff;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer;}
  @media(max-width:600px){.admin-header{padding:0 1rem;}.admin-body{padding:1.25rem 1rem 3rem;}.form-row{grid-template-columns:1fr;}.form-card{padding:1.25rem;}}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">Lyrics<span>Book</span></div>
    <p class="login-sub">Admin Panel — sign in to continue</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@yoursite.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" />
    </div>
    <button class="btn-primary" id="loginBtn">Sign in</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- ADMIN PAGE -->
<div id="adminPage">
  <header class="admin-header">
    <div class="admin-logo">Lyrics<em>Book</em> Admin</div>
    <div class="header-right">
      <a href="index.html">← View site</a>
      <button class="btn-logout" id="logoutBtn">Sign out</button>
    </div>
  </header>
  <div class="admin-body">
    <div class="tabs">
      <button class="tab active" data-tab="add">➕ Add Song</button>
      <button class="tab" data-tab="manage">🎵 Manage Songs</button>
    </div>

    <div class="tab-panel active" id="tab-add">
      <div class="form-card">
        <div class="form-section">
          <div class="form-section-title">Song information</div>
          <div class="form-row">
            <div class="form-field">
              <label>Song title *</label>
              <input type="text" id="fTitle" placeholder="e.g. Kannamoochi Yenada" />
            </div>
            <div class="form-field">
              <label>Movie / Album *</label>
              <input type="text" id="fMovie" placeholder="e.g. Kandukondain" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Release year</label>
              <input type="number" id="fYear" placeholder="e.g. 2001" min="1900" max="2100" />
            </div>
            <div class="form-field">
              <label>Genre</label>
              <select id="fGenre">
                <option value="">Select genre</option>
                <input type="text" id="fGenreInput" placeholder="e.g. Romantic" />
              </select>
            </div>
          </div>
        </div>
        <div class="form-section">
          <div class="form-section-title">Credits</div>
          <div class="form-field">
            <label>Music director *</label>
            <input type="text" id="fDirector" placeholder="e.g. A.R. Rahman" />
          </div>
          <div class="form-field">
            <label>Singer(s) * <span class="tag-hint">(press Enter or comma to add)</span></label>
            <div class="tag-input-wrap" id="singerWrap">
              <input class="tag-input" id="singerInput" type="text" placeholder="Type singer name…" />
            </div>
          </div>
          <div class="form-field">
            <label>Lyricist *</label>
            <input type="text" id="fLyricist" placeholder="e.g. Vairamuthu" />
          </div>
        </div>
        <div class="form-section">
          <div class="form-section-title">Lyrics</div>
          <div class="form-field">
            <label>Language *</label>
            <div class="lang-chips" id="langChips">
              <button class="lang-chip active" data-lang="Tamil">Tamil</button>
              <button class="lang-chip" data-lang="Telugu">Telugu</button>
              <button class="lang-chip" data-lang="Kannada">Kannada</button>
              <button class="lang-chip" data-lang="Malayalam">Malayalam</button>
              <button class="lang-chip" data-lang="Hindi">Hindi</button>
              <button class="lang-chip" data-lang="Other">Other</button>
            </div>
          </div>
          <div class="form-field">
            <label>Full lyrics *</label>
            <textarea id="fLyrics" placeholder="Paste the complete lyrics here."></textarea>
          </div>
        </div>
        <div class="form-footer">
          <button class="btn-secondary" id="clearBtn">Clear form</button>
          <button class="btn-publish" id="publishBtn">Publish song</button>
        </div>
        <div class="edit-bar" id="editBar">
          <span>✏️ Editing existing song — changes will overwrite the published version.</span>
          <button class="btn-secondary" id="cancelEditBtn" style="font-size:.78rem;padding:.4rem .9rem">Cancel edit</button>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-manage">
      <div class="list-header">
        <span class="list-count" id="listCount">Loading…</span>
        <input class="list-search" id="listSearch" type="text" placeholder="Search songs…" />
      </div>
      <div class="song-list" id="songList"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Delete song?</h3>
    <p id="confirmMsg">This will permanently remove the song from the database.</p>
    <div class="confirm-btns">
      <button class="btn-cancel" id="confirmCancel">Cancel</button>
      <button class="btn-delete" id="confirmDelete">Delete</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
  ONE single <script type="module"> block.
  No duplicate imports. No duplicate initializeApp.
════════════════════════════════════════════ -->
<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, getDoc,
           doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCpfcsBeZ4-Jw7d_JLleMH4-fdPTavrFcU",
    authDomain:        "lyricsbook-f15ea.firebaseapp.com",
    projectId:         "lyricsbook-f15ea",
    storageBucket:     "lyricsbook-f15ea.firebasestorage.app",
    messagingSenderId: "918342687321",
    appId:             "1:918342687321:web:1364e736975d7545c7ef48"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  /* AUTH */
  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("adminPage").style.display = "block";
      loadSongs();
    } else {
      document.getElementById("loginPage").style.display = "flex";
      document.getElementById("adminPage").style.display = "none";
    }
  });

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const pass  = document.getElementById("loginPass").value;
    const errEl = document.getElementById("loginError");
    const btn   = document.getElementById("loginBtn");
    errEl.style.display = "none";
    btn.disabled = true; btn.textContent = "Signing in…";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      errEl.textContent   = e.message.replace("Firebase: ","");
      errEl.style.display = "block";
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));
  ["loginEmail","loginPass"].forEach(id =>
    document.getElementById(id).addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    })
  );

  /* TABS */
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
      if (tab.dataset.tab === "manage") loadSongs();
    });
  });

  /* SINGER TAGS */
  let singers = [];
  const singerInput = document.getElementById("singerInput");
  const singerWrap  = document.getElementById("singerWrap");

  function renderSingerTags() {
    document.querySelectorAll(".singer-tag").forEach(t => t.remove());
    singers.forEach((s, i) => {
      const tag = document.createElement("span");
      tag.className = "singer-tag";
      tag.innerHTML = s + ' <button type="button">✕</button>';
      tag.querySelector("button").onclick = () => { singers.splice(i,1); renderSingerTags(); };
      singerWrap.insertBefore(tag, singerInput);
    });
  }
  singerInput.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      const val = singerInput.value.trim().replace(/,$/,"");
      if (val && !singers.includes(val)) { singers.push(val); renderSingerTags(); }
      singerInput.value = "";
    }
  });
  singerWrap.addEventListener("click", () => singerInput.focus());

  /* LANGUAGE CHIPS */
  let selectedLang = "Tamil";
  document.getElementById("langChips").addEventListener("click", e => {
    const chip = e.target.closest(".lang-chip");
    if (!chip) return;
    document.querySelectorAll(".lang-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    selectedLang = chip.dataset.lang;
  });

  /* PUBLISH / UPDATE */
  let editingId = null;

  document.getElementById("publishBtn").addEventListener("click", async () => {
    const title    = document.getElementById("fTitle").value.trim();
    const movie    = document.getElementById("fMovie").value.trim();
    const director = document.getElementById("fDirector").value.trim();
    const lyricist = document.getElementById("fLyricist").value.trim();
    const lyrics   = document.getElementById("fLyrics").value.trim();
    if (!title||!movie||!director||!singers.length||!lyricist||!lyrics) {
      showToast("Please fill in all required (*) fields.","error"); return;
    }
    const data = {
      title, movie, musicDirector:director, singers, lyricist, lyrics,
      language: selectedLang,
      year:  document.getElementById("fYear").value  ? parseInt(document.getElementById("fYear").value) : null,
      genre: document.getElementById("fGenre").value || null,
    };
    const btn = document.getElementById("publishBtn");
    btn.disabled = true; btn.textContent = editingId ? "Saving…" : "Publishing…";
    try {
      if (editingId) {
        await updateDoc(doc(db,"songs",editingId), data);
        showToast("Song updated! ✓","success");
        cancelEdit();
      } else {
        data.createdAt = serverTimestamp();
        await addDoc(collection(db,"songs"), data);
        showToast("Song published! ✓","success");
        clearForm();
      }
      loadSongs();
    } catch(e) {
      showToast("Error: "+e.message,"error");
    } finally {
      btn.disabled = false;
      btn.textContent = editingId ? "Save changes" : "Publish song";
    }
  });

  document.getElementById("clearBtn").addEventListener("click", clearForm);

  function clearForm() {
    ["fTitle","fMovie","fYear","fDirector","fLyricist","fLyrics"].forEach(id =>
      document.getElementById(id).value = ""
    );
    document.getElementById("fGenre").selectedIndex = 0;
    singers=[]; renderSingerTags();
    document.querySelectorAll(".lang-chip").forEach(c => c.classList.remove("active"));
    document.querySelector('.lang-chip[data-lang="Tamil"]').classList.add("active");
    selectedLang = "Tamil";
  }

  function cancelEdit() {
    editingId = null; clearForm();
    document.getElementById("editBar").classList.remove("visible");
    document.getElementById("publishBtn").textContent = "Publish song";
  }
  document.getElementById("cancelEditBtn").addEventListener("click", cancelEdit);

  /* LOAD SONGS */
  let allSongs = [];
  async function loadSongs() {
    const listEl = document.getElementById("songList");
    listEl.innerHTML = '<div class="spinner"></div>';
    try {
      const q = query(collection(db,"songs"), orderBy("createdAt","desc"));
      const snap = await getDocs(q);
      allSongs = snap.docs.map(d => ({id:d.id,...d.data()}));
      renderList(allSongs);
    } catch(e) {
      listEl.innerHTML = `<p style="color:var(--red);font-size:.88rem">${e.message}</p>`;
    }
  }

  function renderList(songs) {
    const listEl = document.getElementById("songList");
    document.getElementById("listCount").textContent = songs.length+" song"+(songs.length!==1?"s":"");
    if (!songs.length) { listEl.innerHTML='<p style="color:var(--muted);padding:2rem 0">No songs yet.</p>'; return; }
    listEl.innerHTML = songs.map(s => {
      const sngrs = Array.isArray(s.singers)?s.singers.join(", "):(s.singers||"—");
      const lc = "lang-"+(s.language||"other").toLowerCase();
      return `<div class="song-row">
        <div class="song-row-info">
          <div class="row-title">${esc(s.title)}</div>
          <div class="row-meta">${esc(s.movie||"")}${s.year?" · "+s.year:""} · ${esc(s.musicDirector)} · ${esc(sngrs)}</div>
        </div>
        <span class="row-lang ${lc}">${s.language||"Other"}</span>
        <div class="row-actions">
          <button class="btn-icon" onclick="startEdit('${s.id}')">✏️</button>
          <button class="btn-icon del" onclick="confirmDelete('${s.id}','${esc(s.title)}')">🗑</button>
        </div>
      </div>`;
    }).join("");
  }

  document.getElementById("listSearch").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    renderList(q ? allSongs.filter(s =>
      [s.title,s.movie,s.musicDirector,s.lyricist,...(Array.isArray(s.singers)?s.singers:[s.singers])]
      .some(v=>(v||"").toLowerCase().includes(q))
    ) : allSongs);
  });

  /* EDIT */
  window.startEdit = async function(id) {
    const snap = await getDoc(doc(db,"songs",id));
    if (!snap.exists()) { showToast("Song not found","error"); return; }
    const s = snap.data();
    editingId = id;
    document.getElementById("fTitle").value    = s.title         ||"";
    document.getElementById("fMovie").value    = s.movie         ||"";
    document.getElementById("fYear").value     = s.year          ||"";
    document.getElementById("fDirector").value = s.musicDirector ||"";
    document.getElementById("fLyricist").value = s.lyricist      ||"";
    document.getElementById("fLyrics").value   = s.lyrics        ||"";
    document.getElementById("fGenre").value    = s.genre         ||"";
    singers = Array.isArray(s.singers)?[...s.singers]:(s.singers?[s.singers]:[]);
    renderSingerTags();
    selectedLang = s.language||"Tamil";
    document.querySelectorAll(".lang-chip").forEach(c =>
      c.classList.toggle("active", c.dataset.lang===selectedLang)
    );
    document.getElementById("publishBtn").textContent = "Save changes";
    document.getElementById("editBar").classList.add("visible");
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    document.querySelector('.tab[data-tab="add"]').classList.add("active");
    document.getElementById("tab-add").classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  };

  /* DELETE */
  let pendingDeleteId = null;
  window.confirmDelete = function(id,title) {
    pendingDeleteId = id;
    document.getElementById("confirmMsg").textContent = '"'+title+'" will be permanently removed.';
    document.getElementById("confirmOverlay").classList.add("open");
  };
  document.getElementById("confirmCancel").addEventListener("click",()=>{
    pendingDeleteId=null;
    document.getElementById("confirmOverlay").classList.remove("open");
  });
  document.getElementById("confirmDelete").addEventListener("click", async ()=>{
    if (!pendingDeleteId) return;
    document.getElementById("confirmOverlay").classList.remove("open");
    try {
      await deleteDoc(doc(db,"songs",pendingDeleteId));
      showToast("Song deleted.","success"); loadSongs();
    } catch(e) { showToast("Delete failed: "+e.message,"error"); }
    pendingDeleteId = null;
  });

  /* TOAST */
  function showToast(msg,type="success") {
    const el = document.getElementById("toast");
    el.textContent = (type==="success"?"✓ ":"✗ ")+msg;
    el.className = "toast "+type+" show";
    setTimeout(()=>el.classList.remove("show"),3500);
  }

  /* UTIL */
  function esc(str) {
    return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;");
  }
</script>
</body>
</html>
