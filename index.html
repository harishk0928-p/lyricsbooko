<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lyricsbook — South Indie Lyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:      #1a1008;
    --paper:    #fdf8f0;
    --cream:    #f5edd8;
    --gold:     #c8882a;
    --gold-lt:  #f0c060;
    --muted:    #7a6a52;
    --border:   #e2d4b8;
    --card-bg:  #fffcf5;
    --red:      #c0392b;
    --shadow:   0 2px 20px rgba(26,16,8,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    padding: 0 2rem;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
    border-bottom: 2px solid var(--gold);
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--gold-lt);
    text-decoration: none;
    letter-spacing: 0.02em;
  }
  .logo span { color: #fff; font-style: italic; }
  nav { display: flex; gap: 1.5rem; align-items: center; }
  nav a {
    color: #ccc; font-size: 0.85rem; text-decoration: none;
    letter-spacing: 0.05em; text-transform: uppercase;
    transition: color 0.2s;
  }
  nav a:hover { color: var(--gold-lt); }

  /* ── HERO ── */
  .hero {
    background: var(--ink);
    padding: 5rem 2rem 4rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,136,42,0.18), transparent);
    pointer-events: none;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    color: #fff;
    line-height: 1.15;
    margin-bottom: 1rem;
  }
  .hero-title em { color: var(--gold-lt); font-style: italic; }
  .hero-sub {
    color: #b0a090;
    font-size: 1.05rem;
    font-weight: 300;
    margin-bottom: 2.5rem;
    letter-spacing: 0.02em;
  }

  /* ── SEARCH ── */
  .search-wrap {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 1rem 1.5rem 1rem 3.2rem;
    border-radius: 50px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    background: #fff;
    color: var(--ink);
    outline: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    transition: box-shadow 0.2s;
  }
  .search-wrap input:focus { box-shadow: 0 4px 32px rgba(200,136,42,0.4); }
  .search-wrap svg {
    position: absolute; left: 1.1rem; top: 50%;
    transform: translateY(-50%);
    color: var(--muted); width: 18px; height: 18px;
  }

  /* ── LANGUAGE FILTER ── */
  .lang-bar {
    display: flex; gap: 0.6rem; flex-wrap: wrap;
    justify-content: center;
    padding: 1.5rem 2rem 0;
    background: var(--ink);
  }
  .lang-btn {
    padding: 0.4rem 1.1rem;
    border-radius: 50px;
    border: 1px solid rgba(200,136,42,0.4);
    background: transparent;
    color: #bbb;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }
  .lang-btn:hover { border-color: var(--gold); color: var(--gold-lt); }
  .lang-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--ink);
    font-weight: 500;
  }

  /* ── WAVE DIVIDER ── */
  .wave { display: block; background: var(--ink); line-height: 0; }
  .wave svg { width: 100%; height: 48px; display: block; }

  /* ── MAIN CONTENT ── */
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    margin-bottom: 1.5rem;
    color: var(--ink);
    display: flex; align-items: center; gap: 0.75rem;
  }
  .section-title::after {
    content: '';
    flex: 1; height: 1px;
    background: var(--border);
  }

  /* ── SONG GRID ── */
  .song-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }
  .song-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .song-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--gold);
    transform: scaleY(0); transform-origin: bottom;
    transition: transform 0.25s;
  }
  .song-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--gold); }
  .song-card:hover::before { transform: scaleY(1); }
  .card-lang {
    display: inline-block;
    font-size: 0.68rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 2px 8px; border-radius: 50px;
    margin-bottom: 0.5rem;
  }
  .lang-tamil    { background: #fce9e9; color: var(--red); }
  .lang-telugu   { background: #e9f0fc; color: #1a4fa0; }
  .lang-kannada  { background: #e9fce9; color: #1a7a30; }
  .lang-malayalam{ background: #f5e9fc; color: #6a1a9a; }
  .lang-hindi    { background: #fef4e8; color: #a06010; }
  .lang-other    { background: #f0f0f0; color: #555; }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 0.25rem;
  }
  .card-movie {
    font-size: 0.82rem;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 0.6rem;
  }
  .card-credits {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .card-credits strong { color: var(--ink); font-weight: 500; }
  .card-preview {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── EMPTY / LOADING ── */
  .state-box {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  .state-box svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.4; }
  .state-box p { font-size: 1rem; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,6,2,0.75);
    padding: 1rem;
    align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card-bg);
    border-radius: 16px;
    max-width: 680px; width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: none; } }
  .modal-header {
    padding: 1.5rem 1.75rem 1rem;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--card-bg);
    border-radius: 16px 16px 0 0;
    z-index: 1;
  }
  .modal-lang { margin-bottom: 0.5rem; }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    line-height: 1.2;
    margin-bottom: 0.25rem;
  }
  .modal-movie { color: var(--gold); font-size: 0.9rem; font-weight: 500; }
  .modal-close {
    position: absolute; top: 1rem; right: 1rem;
    width: 32px; height: 32px;
    border: none; border-radius: 50%;
    background: var(--cream);
    cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: background 0.2s;
  }
  .modal-close:hover { background: var(--border); }
  .modal-body { padding: 1.25rem 1.75rem 2rem; }
  .credits-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .credit-chip {
    background: var(--cream);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
  }
  .credit-chip .label {
    font-size: 0.7rem; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--muted); margin-bottom: 2px;
  }
  .credit-chip .value { font-size: 0.9rem; font-weight: 500; color: var(--ink); }
  .lyrics-block {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    line-height: 2;
    white-space: pre-wrap;
    color: var(--ink);
    border-left: 3px solid var(--gold);
    padding-left: 1.25rem;
  }

  /* ── FOOTER ── */
  footer {
    background: var(--ink);
    text-align: center;
    padding: 2rem;
    color: #666;
    font-size: 0.82rem;
    border-top: 2px solid var(--gold);
  }
  footer a { color: var(--gold); text-decoration: none; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    nav a { font-size: 0.75rem; }
    .hero { padding: 3rem 1.25rem 2.5rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .modal-body { padding: 1rem 1.25rem 1.5rem; }
    .modal-header { padding: 1.25rem 1.25rem 0.75rem; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="index.html" class="logo">lyrics<span>Book</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="#songs">Songs</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1 class="hero-title">South Indie Lyrics<br><em>All in one place</em></h1>
  <p class="hero-sub">Tamil · Telugu · Kannada · Malayalam · Hindi</p>
  <div class="search-wrap">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search song, movie, singer, lyricist…" />
  </div>
</section>

<!-- LANGUAGE FILTER -->
<div class="lang-bar" id="langBar">
  <button class="lang-btn active" data-lang="all">All</button>
  <button class="lang-btn" data-lang="Tamil">Tamil</button>
  <button class="lang-btn" data-lang="Telugu">Telugu</button>
  <button class="lang-btn" data-lang="Kannada">Kannada</button>
  <button class="lang-btn" data-lang="Malayalam">Malayalam</button>
  <button class="lang-btn" data-lang="Hindi">Hindi</button>
  <button class="lang-btn" data-lang="Other">Other</button>
</div>

<!-- WAVE -->
<div class="wave">
  <svg viewBox="0 0 1200 48" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 0 C300 48 900 48 1200 0 L1200 48 L0 48 Z" fill="#fdf8f0"/>
  </svg>
</div>

<!-- MAIN -->
<main>
  <h2 class="section-title">Songs</h2>
  <div class="song-grid" id="songGrid">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Loading songs…</p>
    </div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div class="modal-lang" id="modalLang"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-movie" id="modalMovie"></p>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="credits-grid" id="modalCredits"></div>
      <div class="lyrics-block" id="modalLyrics"></div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <p>© 2026 lyricsbook · <a href="admin.html">Admin Panel</a></p>
</footer>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────
  // Import the functions you need from the SDKs you need
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCpfcsBeZ4-Jw7d_JLleMH4-fdPTavrFcU",
  authDomain: "lyricsbook-f15ea.firebaseapp.com",
  projectId: "lyricsbook-f15ea",
  storageBucket: "lyricsbook-f15ea.firebasestorage.app",
  messagingSenderId: "918342687321",
  appId: "1:918342687321:web:1364e736975d7545c7ef48"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
  // ─────────────────────────────────────────────────────────────────

  const db  = getFirestore(app);

  let allSongs = [];
  let activeLang = "all";

  /* ── FETCH ALL SONGS ── */
  async function loadSongs() {
    const grid = document.getElementById("songGrid");
    try {
      const q    = query(collection(db, "songs"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      allSongs   = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderGrid(allSongs);
    } catch (err) {
      grid.innerHTML = `<div class="state-box">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        <p>Could not load songs. Check Firebase config.</p>
        <small style="font-size:.75rem;margin-top:.5rem;display:block">${err.message}</small>
      </div>`;
    }
  }

  /* ── RENDER GRID ── */
  function renderGrid(songs) {
    const grid = document.getElementById("songGrid");
    if (!songs.length) {
      grid.innerHTML = `<div class="state-box">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z"/>
        </svg>
        <p>No songs found.</p>
      </div>`;
      return;
    }
    grid.innerHTML = songs.map(s => {
      const langClass = "lang-" + (s.language || "other").toLowerCase();
      const preview   = (s.lyrics || "").split("\n").find(l => l.trim()) || "";
      const singers   = Array.isArray(s.singers) ? s.singers.join(", ") : (s.singers || "");
      return `
        <div class="song-card" onclick="openModal('${s.id}')">
          <span class="card-lang ${langClass}">${s.language || "Other"}</span>
          <div class="card-title">${esc(s.title)}</div>
          <div class="card-movie">${esc(s.movie || s.album || "")}</div>
          <div class="card-credits">
            <strong>Music:</strong> ${esc(s.musicDirector)}<br>
            <strong>Singer:</strong> ${esc(singers)}<br>
            <strong>Lyrics:</strong> ${esc(s.lyricist)}
          </div>
          ${preview ? `<div class="card-preview">${esc(preview)}</div>` : ""}
        </div>`;
    }).join("");
  }

  /* ── SEARCH + FILTER ── */
  function applyFilters() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    let filtered = allSongs;
    if (activeLang !== "all")
      filtered = filtered.filter(s => (s.language || "").toLowerCase() === activeLang.toLowerCase());
    if (q) {
      filtered = filtered.filter(s =>
        [s.title, s.movie, s.album, s.musicDirector, s.lyricist,
          ...(Array.isArray(s.singers) ? s.singers : [s.singers])]
        .some(v => (v || "").toLowerCase().includes(q))
      );
    }
    renderGrid(filtered);
  }

  document.getElementById("searchInput").addEventListener("input", applyFilters);

  document.getElementById("langBar").addEventListener("click", e => {
    const btn = e.target.closest(".lang-btn");
    if (!btn) return;
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeLang = btn.dataset.lang;
    applyFilters();
  });

  /* ── MODAL ── */
  window.openModal = function(id) {
    const s = allSongs.find(x => x.id === id);
    if (!s) return;
    const langClass = "lang-" + (s.language || "other").toLowerCase();
    const singers   = Array.isArray(s.singers) ? s.singers.join(", ") : (s.singers || "—");
    document.getElementById("modalLang").innerHTML =
      `<span class="card-lang ${langClass}">${s.language || "Other"}</span>`;
    document.getElementById("modalTitle").textContent  = s.title || "";
    document.getElementById("modalMovie").textContent  = s.movie || s.album || "";
    document.getElementById("modalCredits").innerHTML  = `
      <div class="credit-chip"><div class="label">Music Director</div><div class="value">${esc(s.musicDirector)}</div></div>
      <div class="credit-chip"><div class="label">Singer(s)</div><div class="value">${esc(singers)}</div></div>
      <div class="credit-chip"><div class="label">Lyricist</div><div class="value">${esc(s.lyricist)}</div></div>
      ${s.year ? `<div class="credit-chip"><div class="label">Year</div><div class="value">${s.year}</div></div>` : ""}
      ${s.genre ? `<div class="credit-chip"><div class="label">Genre</div><div class="value">${esc(s.genre)}</div></div>` : ""}
    `;
    document.getElementById("modalLyrics").textContent = s.lyrics || "";
    document.getElementById("modalOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
  };

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
    document.body.style.overflow = "";
  }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("modalOverlay")) closeModal();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  /* ── UTIL ── */
  function esc(str) {
    return (str || "—").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  loadSongs();
</script>
</body>
</html>
